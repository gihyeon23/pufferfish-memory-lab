# Fig 6(a) 그래프 모양 맞춤용 프로파일 "pf6a" (2026-11-02, x86-server/steps/10)
#   기준을 "입력 1/4"(pfq)에서 "job별 메모리 비율"로 바꿈 [우리]
#   - PR: 논문에서 64GB 힙을 거의 다 쓰는 job (p.259, 원 저자 memory_test 약 64GiB) → MAX_HEAP 16GB 근처가 목표
#     pfq(1.25×10^6)는 단독 최대 10.4GB라 작음 → 페이지 수를 늘림
#   - KM: pfq 그대로 (단독 12.4GB = 노드 44%, 논문 61GB = 51% [p.266]와 비슷)
# 사용: /opt/HiBench-6.0/conf-pf6a/ 에 conf/*.conf와 함께 두고 HIBENCH_CONF_FOLDER로 지정 (이름순으로 마지막에 읽힘)
hibench.scale.profile                  pf6a

hibench.pagerank.pf6a.pages			2500000
hibench.pagerank.pf6a.num_iterations		3
hibench.pagerank.pf6a.block			0
hibench.pagerank.pf6a.block_width		16

hibench.kmeans.pf6a.num_of_clusters		5
hibench.kmeans.pf6a.dimensions			20
hibench.kmeans.pf6a.num_of_samples		25000000
hibench.kmeans.pf6a.samples_per_inputfile	5000000
hibench.kmeans.pf6a.max_iteration		5
hibench.kmeans.pf6a.k				10
hibench.kmeans.pf6a.convergedist		0.5
