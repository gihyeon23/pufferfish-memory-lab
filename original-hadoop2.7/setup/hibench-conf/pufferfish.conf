# HiBench 6.0 — 데이터 규모 프로파일 "pfq" = 논문 Table 1 Small의 1/4 [p.265]
# conf/*.conf는 이름순으로 읽힘 → hibench.conf 뒤에 읽혀서 scale.profile을 덮어씀
# 논문에 없는 파라미터(차원·k·반복 등)는 HiBench 기본값(huge/large 프로파일과 같은 값)
hibench.scale.profile                  pfq

# Spark-WC: 논문 100GB → 25GB (HiBench datasize는 바이트, huge 32GB = 32000000000)
hibench.wordcount.pfq.datasize                 25000000000

# Spark-KM: 논문 1×10^8 샘플 (= HiBench huge) → 2.5×10^7
hibench.kmeans.pfq.num_of_clusters		5
hibench.kmeans.pfq.dimensions			20
hibench.kmeans.pfq.num_of_samples		25000000
hibench.kmeans.pfq.samples_per_inputfile	5000000
hibench.kmeans.pfq.max_iteration		5
hibench.kmeans.pfq.k				10
hibench.kmeans.pfq.convergedist		0.5

# Spark-PR: 논문 5×10^6 페이지 (= HiBench huge) → 1.25×10^6
hibench.pagerank.pfq.pages			1250000
hibench.pagerank.pfq.num_iterations		3
hibench.pagerank.pfq.block			0
hibench.pagerank.pfq.block_width		16

# Spark-NW: 논문 1×10^7 엣지 (= HiBench large) → 2.5×10^6
hibench.nweight.pfq.edges                     2500000
hibench.nweight.pfq.degree                    3
hibench.nweight.pfq.max_out_edges             30
