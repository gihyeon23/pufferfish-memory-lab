# HiBench 6.0 — Hadoop 경로 (install-hibench.sh가 /opt/HiBench-6.0/conf/로 복사)
hibench.hadoop.home           /opt/hadoop-2.7.3
hibench.hadoop.executable     ${hibench.hadoop.home}/bin/hadoop
hibench.hadoop.configure.dir  ${hibench.hadoop.home}/etc/hadoop
# core-site.xml fs.defaultFS와 같게
hibench.hdfs.master           hdfs://ubuntu:9000
hibench.hadoop.release        apache
