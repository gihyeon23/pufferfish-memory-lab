# HiBench 6.0 — Spark 실행 설정 (install-hibench.sh가 /opt/HiBench-6.0/conf/로 복사)
# 원칙: 논문 "default configuration of Spark and Hadoop, except ... heap size" [p.265]
#   → 논문·Table 1에 있는 값만 지정하고, 나머지는 Spark 기본값 (x86-server/steps/08)
hibench.spark.home      /opt/spark-2.0.1-bin-hadoop2.7
hibench.spark.master    yarn-client

# Table 1 Small = executor 1개 [p.265] (단일 노드 실험은 Small)
hibench.yarn.executor.num     1
# 논문에 없음 → Spark on YARN 기본값 1 (HiBench 템플릿은 4)
hibench.yarn.executor.cores   1
# MIN_CONT 4GB [p.265]의 1/4. 원 README: MIN_CONT는 spark.executor.memory로 지정
spark.executor.memory  1g
# Flex 컨테이너 (원 README, steps/06)
spark.yarn.am.nodeLabelExpression  flex

# HiBench 템플릿에서 뺀 값 (Spark 기본값 사용):
#   spark.driver.memory 4g, spark.default.parallelism / spark.sql.shuffle.partitions = map.parallelism
